# WiFi 模组测试流水线

测试 WiFi 模组的 AT 指令接口：基本通信、Station 模式配置、AP 扫描、连接测试。

```yaml
Config:
  description: "WiFi 模组功能测试（Steps 格式）"
  mode: single

Devices:
  - name: DeviceA
    port: COM16
    baud_rate: 115200
    dtr: true
    rts: true

Constants:
  SSID: "YourWiFiSSID"
  PASSWORD: "YourWiFiPassword"
  API_BASE: "http://192.168.1.1"

Steps:
  - id: check_basic
    name: "检查基本通信"
    type: serial
    device: DeviceA
    send: "AT"
    expect: ["OK"]
    timeout: 3

  - id: check_fw_version
    name: "获取固件版本"
    type: serial
    device: DeviceA
    send: "AT+GVERSION"
    expect: ["OK"]
    timeout: 5
    capture:
      version: 'Version: (.+)'

  - id: check_signal
    name: "检查信号质量"
    type: serial
    device: DeviceA
    send: "AT+CSQ"
    expect: ["OK"]
    timeout: 5
    capture:
      rssi: 'CSQ: (\d+)'

  - id: set_station_mode
    name: "设置为 Station 模式"
    type: serial
    device: DeviceA
    send: 'AT+CWMODE=1'
    expect: ["OK", "WIFI CONNECTED"]
    timeout: 5

  - id: scan_ap
    name: "扫描接入点"
    type: serial
    device: DeviceA
    send: "AT+CWLAP"
    expect: ["OK", "CWLAP:"]
    timeout: 15
    capture:
      aps: 'CWLAP:"(.*?)"'

  - id: connect_wifi
    name: "连接 WiFi"
    type: serial
    device: DeviceA
    send: 'AT+CWJAP="{SSID}","{PASSWORD}"'
    expect: ["OK", "WIFI CONNECTED", "GOT IP"]
    timeout: 30
    on_error: retry(2)

  - id: get_ip
    name: "获取分配的 IP"
    type: serial
    device: DeviceA
    send: "AT+CIFSR"
    expect: ["OK"]
    timeout: 5
    capture:
      ip: '"(?:STA|STATIC)IP,"(.+?)"'

  - id: check_connectivity
    name: "通过 Ping 验证网络连通性"
    type: serial
    device: DeviceA
    send: "AT+PING=114.114.114.114"
    expect: ["OK", "+PING:"]
    timeout: 15
    on_error: skip

  - id: http_get
    name: "HTTP GET 状态"
    type: http
    url: "{{ constants.API_BASE }}/status"
    method: GET
    expect:
      status_code: 200
    timeout: 10

  - id: print_summary
    name: "打印测试摘要"
    type: action_batch
    actions:
      - print: "固件: {{ steps.check_fw_version.capture.version }}"
      - print: "信号: {{ steps.check_signal.capture.rssi }}"
      - print: "IP: {{ steps.get_ip.capture.ip }}"
```

## 循环变体（稳定性测试）

```yaml
Config:
  description: "WiFi 重连稳定性测试"
  mode: loop
  loop:
    iterations: 100
    interval_ms: 2000
    stop_on_failure: true

Devices:
  - name: DeviceA
    port: COM16
    baud_rate: 115200

Constants:
  SSID: "YourWiFiSSID"
  PASSWORD: "YourWiFiPassword"

Steps:
  - id: connect_wifi
    name: "连接 WiFi"
    type: serial
    device: DeviceA
    send: 'AT+CWJAP="{SSID}","{PASSWORD}"'
    expect: ["OK", "WIFI CONNECTED", "GOT IP"]
    timeout: 30
    on_error: retry(2)

  - id: get_ip
    name: "获取 IP"
    type: serial
    device: DeviceA
    send: "AT+CIFSR"
    expect: ["OK"]
    timeout: 5

  - id: disconnect
    name: "断开 WiFi"
    type: serial
    device: DeviceA
    send: "AT+CWQAP"
    expect: ["OK"]
    timeout: 5
```