# BLE 模组测试流水线

测试 BLE 模组的 AT 指令接口：扫描、广播、连接、数据传输。

```yaml
Config:
  description: "BLE 模组功能测试（Steps 格式）"
  mode: single

Devices:
  - name: DeviceA
    port: COM16
    baud_rate: 115200

Constants:
  BLE_NAME: "AutoCom_BLE"
  TARGET_MAC: "AA:BB:CC:DD:EE:FF"
  SCAN_DURATION: 10

Steps:
  - id: check_basic
    name: "基本通信检查"
    type: serial
    device: DeviceA
    send: "AT"
    expect: ["OK"]
    timeout: 3

  - id: get_mac
    name: "获取设备 MAC 地址"
    type: serial
    device: DeviceA
    send: "AT+BLEMAC?"
    expect: ["OK"]
    timeout: 5
    capture:
      mac: 'MAC: (.+)'

  - id: set_adv_data
    name: "设置 BLE 广播数据"
    type: serial
    device: DeviceA
    send: 'AT+BLEADVDATA="{BLE_NAME}"'
    expect: ["OK"]
    timeout: 5

  - id: start_adv
    name: "启动 BLE 广播"
    type: serial
    device: DeviceA
    send: "AT+BLEADV=1"
    expect: ["OK"]
    timeout: 5

  - id: scan_devices
    name: "扫描 BLE 设备"
    type: serial
    device: DeviceA
    send: "AT+BLESCAN={SCAN_DURATION}"
    expect: ["OK"]
    timeout: 15
    capture:
      devices: 'DEV: (.+?),(.+?),(-?\d+)'

  - id: stop_adv
    name: "停止广播"
    type: serial
    device: DeviceA
    send: "AT+BLEADV=0"
    expect: ["OK"]
    timeout: 5

  - id: pair_device
    name: "配对目标设备"
    type: serial
    device: DeviceA
    send: 'AT+BLEPAIR="{TARGET_MAC}"'
    expect: ["OK", "PAIR OK", "CONNECTED"]
    timeout: 15
    on_error: skip

  - id: send_data
    name: "通过 BLE 发送数据"
    type: serial
    device: DeviceA
    send: 'AT+BLESEND="Hello from AutoCom"'
    expect: ["OK", "SENT", "SEND OK"]
    timeout: 10
    on_error: skip

  - id: disconnect
    name: "断开 BLE 连接"
    type: serial
    device: DeviceA
    send: "AT+BLEDISCONN"
    expect: ["OK"]
    timeout: 5

  - id: print_summary
    name: "打印测试摘要"
    type: action_batch
    actions:
      - print: "MAC: {{ steps.get_mac.capture.mac }}"
      - print: "扫描结果: {{ steps.scan_devices.capture.devices }}"
```

## 连接监视模式（被动模式）

```yaml
Config:
  description: "BLE 连接监视"
  mode: single

Devices:
  - name: DeviceA
    port: COM16
    baud_rate: 115200

Steps:
  - id: check
    name: "基本检查"
    type: serial
    device: DeviceA
    send: "AT"
    expect: ["OK"]
    timeout: 3

  - id: start_adv
    name: "启动广播"
    type: serial
    device: DeviceA
    send: "AT+BLEADV=1"
    expect: ["OK"]
    timeout: 5

  - id: wait_connection
    name: "等待 BLE 连接事件"
    type: serial_wait
    device: DeviceA
    expect: ["CONNECTED", "PAIR OK"]
    timeout: 60
```